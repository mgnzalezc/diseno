<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!--12-Cuando el usuario hace clic en un <button>, cambia el texto a "Clicado".-->
</head>
<body>
    <form action="">
        <input type="button" value="Falto">
    </form>
</body>
</html>
<script>
    $(function(){
        $("input").click(function (e) {
            e.preventDefault();
            $(this).val("Clicado");
        })
    });
</script>
