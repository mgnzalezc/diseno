<!DOCTYPE html>
<html lang="en">
<head>

<body>

                    <div class="row mb-3">

                            <input type="text" name="nombre" class="form-control">
                        </div>
                        <div class="col">
                            <label for="nombre" class="form-label">Apellido</label>

                    <div class="row mb-3">

                        </div>
                    </div> <!--@-->


                    <div class="row mb-3">

                </div> <!--direccion envio-->
